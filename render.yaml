services:
  - type: web
    name: oibsip-retail-sales-dashboard
    runtime: python
    rootDir: DataAnalytics-L1-EDARetailSales
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
